  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#gemini_bg)"/>
  <circle cx="40" cy="40" r="35" fill="#FFF" fill-opacity="0.15"/>
  
  <!-- Left Twin -->
  <!-- Hair -->
