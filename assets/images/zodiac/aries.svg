<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="aries_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>
    <linearGradient id="aries_face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="100%" stop-color="#FFE4C9"/>
    </linearGradient>
    <linearGradient id="aries_horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#aries_bg)"/>
  <circle cx="40" cy="40" r="35" fill="#FFF" fill-opacity="0.15"/>
  
  <!-- Fluffy Body -->
  <ellipse cx="40" cy="52" rx="22" ry="18" fill="url(#aries_face)"/>
  
  <!-- Face -->
  <circle cx="40" cy="42" r="18" fill="url(#aries_face)"/>
  
  <!-- Fluffy cheeks -->
  <circle cx="28" cy="45" r="5" fill="#FFB7B7" fill-opacity="0.5"/>
  <circle cx="52" cy="45" r="5" fill="#FFB7B7" fill-opacity="0.5"/>
  
  <!-- Left Horn -->
  <path d="M22 30 Q18 22 24 18 Q30 16 28 26 Q27 30 26 32" fill="url(#aries_horn)" stroke="#E88B00" stroke-width="1"/>
  <!-- Right Horn -->
  <path d="M58 30 Q62 22 56 18 Q50 16 52 26 Q53 30 54 32" fill="url(#aries_horn)" stroke="#E88B00" stroke-width="1"/>
  
  <!-- Ears -->
  <ellipse cx="24" cy="38" rx="4" ry="6" fill="url(#aries_face)" stroke="#FFCBA4" stroke-width="1"/>
  <ellipse cx="56" cy="38" rx="4" ry="6" fill="url(#aries_face)" stroke="#FFCBA4" stroke-width="1"/>
  <ellipse cx="24" cy="38" rx="2" ry="3" fill="#FFB7B7" fill-opacity="0.5"/>
  <ellipse cx="56" cy="38" rx="2" ry="3" fill="#FFB7B7" fill-opacity="0.5"/>
  
  <!-- Eyes -->
  <circle cx="34" cy="40" r="4" fill="#4A3728"/>
  <circle cx="46" cy="40" r="4" fill="#4A3728"/>
  <circle cx="35" cy="39" r="1.5" fill="#FFF"/>
  <circle cx="47" cy="39" r="1.5" fill="#FFF"/>
  
  <!-- Cute nose -->
  <ellipse cx="40" cy="47" rx="3" ry="2" fill="#FFB7B7"/>
  
  <!-- Smile -->
  <path d="M36 51 Q40 55 44 51" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Fluffy wool texture -->
  <circle cx="32" cy="58" r="4" fill="#FFF" fill-opacity="0.6"/>
  <circle cx="40" cy="60" r="4" fill="#FFF" fill-opacity="0.6"/>
  <circle cx="48" cy="58" r="4" fill="#FFF" fill-opacity="0.6"/>
  
  <!-- Stars decoration -->
  <path d="M14 14 L15.5 18 L14 16.5 L12.5 18 Z" fill="#FFD93D"/>
  <path d="M66 12 L67.5 16 L66 14.5 L64.5 16 Z" fill="#FFD93D"/>
</svg>
