<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="cancer_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8DADC"/>
      <stop offset="100%" stop-color="#457B9D"/>
    </linearGradient>
    <linearGradient id="cancer_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="cancer_belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="100%" stop-color="#FFB7B7"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#cancer_bg)"/>
  <circle cx="40" cy="40" r="35" fill="#FFF" fill-opacity="0.15"/>
  
  <!-- Bubbles -->
  <circle cx="15" cy="18" r="3" fill="#FFF" fill-opacity="0.4"/>
  <circle cx="65" cy="22" r="2" fill="#FFF" fill-opacity="0.4"/>
  <circle cx="20" cy="60" r="2.5" fill="#FFF" fill-opacity="0.4"/>
  <circle cx="62" cy="58" r="2" fill="#FFF" fill-opacity="0.4"/>
  
  <!-- Body/Shell -->
  <ellipse cx="40" cy="44" rx="22" ry="18" fill="url(#cancer_body)"/>
  
  <!-- Shell pattern -->
  <ellipse cx="40" cy="44" rx="16" ry="12" fill="url(#cancer_belly)"/>
  <path d="M30 38 Q40 32 50 38" stroke="#FF8A80" stroke-width="1.5" fill="none"/>
  <path d="M28 44 Q40 38 52 44" stroke="#FF8A80" stroke-width="1.5" fill="none"/>
  <path d="M30 50 Q40 44 50 50" stroke="#FF8A80" stroke-width="1.5" fill="none"/>
  
  <!-- Claws -->
  <!-- Left Claw -->
  <ellipse cx="14" cy="38" rx="8" ry="6" fill="url(#cancer_body)"/>
  <ellipse cx="10" cy="36" rx="4" ry="5" fill="url(#cancer_body)"/>
  <ellipse cx="10" cy="40" rx="4" ry="5" fill="url(#cancer_body)"/>
  
  <!-- Right Claw -->
  <ellipse cx="66" cy="38" rx="8" ry="6" fill="url(#cancer_body)"/>
  <ellipse cx="70" cy="36" rx="4" ry="5" fill="url(#cancer_body)"/>
  <ellipse cx="70" cy="40" rx="4" ry="5" fill="url(#cancer_body)"/>
  
  <!-- Legs -->
  <ellipse cx="22" cy="58" rx="4" ry="6" fill="url(#cancer_body)" transform="rotate(-20 22 58)"/>
  <ellipse cx="30" cy="60" rx="3" ry="5" fill="url(#cancer_body)" transform="rotate(-10 30 60)"/>
  <ellipse cx="50" cy="60" rx="3" ry="5" fill="url(#cancer_body)" transform="rotate(10 50 60)"/>
  <ellipse cx="58" cy="58" rx="4" ry="6" fill="url(#cancer_body)" transform="rotate(20 58 58)"/>
  
  <!-- Eyes -->
  <!-- Eye stalks -->
  <ellipse cx="34" cy="28" rx="3" ry="6" fill="url(#cancer_body)"/>
  <ellipse cx="46" cy="28" rx="3" ry="6" fill="url(#cancer_body)"/>
  
  <!-- Eyeballs -->
  <circle cx="34" cy="24" r="5" fill="#FFF"/>
  <circle cx="46" cy="24" r="5" fill="#FFF"/>
  <circle cx="34" cy="24" r="3" fill="#2D2013"/>
  <circle cx="46" cy="24" r="3" fill="#2D2013"/>
  <circle cx="35" cy="23" r="1" fill="#FFF"/>
  <circle cx="47" cy="23" r="1" fill="#FFF"/>
  
  <!-- Blush -->
  <circle cx="30" cy="36" r="3" fill="#FF8A80" fill-opacity="0.5"/>
  <circle cx="50" cy="36" r="3" fill="#FF8A80" fill-opacity="0.5"/>
  
  <!-- Smile -->
  <path d="M36 40 Q40 44 44 40" stroke="#D32F2F" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Stars -->
  <circle cx="12" cy="12" r="2" fill="#FFD93D"/>
  <circle cx="68" cy="14" r="1.5" fill="#FFD93D"/>
</svg>
