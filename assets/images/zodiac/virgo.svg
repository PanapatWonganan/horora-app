<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="virgo_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA0DD"/>
      <stop offset="100%" stop-color="#BA68C8"/>
    </linearGradient>
    <linearGradient id="virgo_skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4D6"/>
      <stop offset="100%" stop-color="#FFCDB2"/>
    </linearGradient>
    <linearGradient id="virgo_hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    <linearGradient id="virgo_dress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#virgo_bg)"/>
  <circle cx="40" cy="40" r="35" fill="#FFF" fill-opacity="0.15"/>
  
  <!-- Hair back -->
  <ellipse cx="40" cy="36" rx="18" ry="20" fill="url(#virgo_hair)"/>
  <ellipse cx="26" cy="50" rx="6" ry="12" fill="url(#virgo_hair)"/>
  <ellipse cx="54" cy="50" rx="6" ry="12" fill="url(#virgo_hair)"/>
  
  <!-- Dress/Body -->
  <ellipse cx="40" cy="62" rx="16" ry="12" fill="url(#virgo_dress)"/>
  <path d="M28 55 Q40 50 52 55 L52 68 Q40 72 28 68 Z" fill="url(#virgo_dress)"/>
  
  <!-- Face -->
  <ellipse cx="40" cy="38" rx="14" ry="15" fill="url(#virgo_skin)"/>
  
  <!-- Hair front bangs -->
  <path d="M26 30 Q30 24 40 22 Q50 24 54 30 Q52 32 40 34 Q28 32 26 30" fill="url(#virgo_hair)"/>
  
  <!-- Hair accessories - wheat -->
  <path d="M56 26 Q62 22 64 28" stroke="#FFD93D" stroke-width="2" fill="none"/>
  <ellipse cx="64" cy="24" rx="2" ry="3" fill="#FFD93D"/>
  <ellipse cx="66" cy="27" rx="2" ry="3" fill="#FFD93D"/>
  <ellipse cx="64" cy="30" rx="2" ry="3" fill="#FFD93D"/>
  
  <!-- Eyes -->
  <ellipse cx="35" cy="38" rx="3" ry="3.5" fill="#4A3728"/>
  <ellipse cx="45" cy="38" rx="3" ry="3.5" fill="#4A3728"/>
  <circle cx="36" cy="37" r="1.2" fill="#FFF"/>
  <circle cx="46" cy="37" r="1.2" fill="#FFF"/>
  
  <!-- Eyelashes -->
  <path d="M32 35 L30 33" stroke="#4A3728" stroke-width="1" stroke-linecap="round"/>
  <path d="M35 34 L34 32" stroke="#4A3728" stroke-width="1" stroke-linecap="round"/>
  <path d="M48 35 L50 33" stroke="#4A3728" stroke-width="1" stroke-linecap="round"/>
  <path d="M45 34 L46 32" stroke="#4A3728" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Blush -->
  <circle cx="30" cy="42" r="3" fill="#FFB7B7" fill-opacity="0.5"/>
  <circle cx="50" cy="42" r="3" fill="#FFB7B7" fill-opacity="0.5"/>
  
  <!-- Nose -->
  <circle cx="40" cy="42" r="1" fill="#FFCDB2"/>
  
  <!-- Smile -->
  <path d="M36 47 Q40 50 44 47" stroke="#4A3728" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  
  <!-- Flower on dress -->
  <circle cx="40" cy="58" r="3" fill="#FF6B9D"/>
  <circle cx="40" cy="58" r="1.5" fill="#FFD93D"/>
  
  <!-- Wing decoration -->
  <path d="M18 44 Q14 40 18 36 Q22 40 18 44" fill="#FFF" fill-opacity="0.6"/>
  <path d="M62 44 Q66 40 62 36 Q58 40 62 44" fill="#FFF" fill-opacity="0.6"/>
  
  <!-- Stars -->
  <circle cx="14" cy="16" r="2" fill="#FFD93D"/>
  <circle cx="66" cy="14" r="1.5" fill="#FFD93D"/>
  <circle cx="12" cy="64" r="1.5" fill="#FFF"/>
</svg>
