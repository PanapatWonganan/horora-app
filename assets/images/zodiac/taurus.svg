<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="taurus_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#56AB91"/>
    </linearGradient>
    <linearGradient id="taurus_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#6B5344"/>
    </linearGradient>
    <linearGradient id="taurus_horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B5"/>
      <stop offset="100%" stop-color="#DEB887"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#taurus_bg)"/>
  <circle cx="40" cy="40" r="35" fill="#FFF" fill-opacity="0.15"/>
  
  <!-- Face -->
  <circle cx="40" cy="44" r="20" fill="url(#taurus_body)"/>
  
  <!-- Muzzle -->
  <ellipse cx="40" cy="52" rx="12" ry="8" fill="#C4A484"/>
  
  <!-- Left Horn -->
  <path d="M18 32 Q12 26 14 20 Q18 16 22 22 Q24 28 22 34" fill="url(#taurus_horn)" stroke="#C4A484" stroke-width="1"/>
  <!-- Right Horn -->
  <path d="M62 32 Q68 26 66 20 Q62 16 58 22 Q56 28 58 34" fill="url(#taurus_horn)" stroke="#C4A484" stroke-width="1"/>
  
  <!-- Ears -->
  <ellipse cx="22" cy="40" rx="5" ry="7" fill="url(#taurus_body)" stroke="#5A4333" stroke-width="1"/>
  <ellipse cx="58" cy="40" rx="5" ry="7" fill="url(#taurus_body)" stroke="#5A4333" stroke-width="1"/>
  <ellipse cx="22" cy="40" rx="2.5" ry="4" fill="#FFB7B7" fill-opacity="0.4"/>
  <ellipse cx="58" cy="40" rx="2.5" ry="4" fill="#FFB7B7" fill-opacity="0.4"/>
  
  <!-- White patch on forehead -->
  <path d="M36 30 Q40 26 44 30 L44 36 Q40 38 36 36 Z" fill="#FFF" fill-opacity="0.8"/>
  
  <!-- Eyes -->
  <circle cx="33" cy="42" r="4" fill="#2D2013"/>
  <circle cx="47" cy="42" r="4" fill="#2D2013"/>
  <circle cx="34" cy="41" r="1.5" fill="#FFF"/>
  <circle cx="48" cy="41" r="1.5" fill="#FFF"/>
  
  <!-- Nostrils -->
  <ellipse cx="36" cy="54" rx="2" ry="1.5" fill="#8B7355"/>
  <ellipse cx="44" cy="54" rx="2" ry="1.5" fill="#8B7355"/>
  
  <!-- Blush -->
  <circle cx="26" cy="48" r="4" fill="#FFB7B7" fill-opacity="0.4"/>
  <circle cx="54" cy="48" r="4" fill="#FFB7B7" fill-opacity="0.4"/>
  
  <!-- Smile -->
  <path d="M35 58 Q40 62 45 58" stroke="#5A4333" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Flower decoration -->
  <circle cx="60" cy="26" r="4" fill="#FFB7B7"/>
  <circle cx="60" cy="26" r="2" fill="#FFD93D"/>
  
  <!-- Stars -->
  <circle cx="16" cy="16" r="2" fill="#FFD93D"/>
  <circle cx="64" cy="64" r="1.5" fill="#FFD93D"/>
</svg>
