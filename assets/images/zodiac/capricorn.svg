<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="cap_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4E6D"/>
      <stop offset="100%" stop-color="#4A3F5C"/>
    </linearGradient>
    <linearGradient id="cap_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
    <linearGradient id="cap_tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DB6AC"/>
      <stop offset="100%" stop-color="#26A69A"/>
    </linearGradient>
    <linearGradient id="cap_horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#cap_bg)"/>
  <circle cx="40" cy="40" r="35" fill="#FFF" fill-opacity="0.15"/>
  
  <!-- Fish tail -->
  <path d="M50 50 Q60 52 66 60 Q72 68 68 72 Q64 70 58 66 Q52 62 50 54" fill="url(#cap_tail)"/>
  <ellipse cx="68" cy="68" rx="6" ry="8" fill="url(#cap_tail)" transform="rotate(45 68 68)"/>
  
  <!-- Tail fin details -->
  <path d="M64 62 Q68 58 72 62" stroke="#80CBC4" stroke-width="1" fill="none"/>
  <path d="M66 66 Q70 62 74 66" stroke="#80CBC4" stroke-width="1" fill="none"/>
  
  <!-- Scales on tail -->
  <circle cx="54" cy="54" r="2" fill="#80CBC4" fill-opacity="0.5"/>
  <circle cx="58" cy="58" r="2" fill="#80CBC4" fill-opacity="0.5"/>
  <circle cx="62" cy="62" r="2" fill="#80CBC4" fill-opacity="0.5"/>
  
  <!-- Body -->
  <ellipse cx="36" cy="48" rx="18" ry="14" fill="url(#cap_body)"/>
  
  <!-- Front legs -->
  <rect x="22" y="54" width="5" height="12" rx="2" fill="url(#cap_body)"/>
  <rect x="32" y="56" width="4" height="10" rx="2" fill="url(#cap_body)"/>
  
  <!-- Hooves -->
  <ellipse cx="24.5" cy="66" rx="3" ry="2" fill="#4E342E"/>
  <ellipse cx="34" cy="66" rx="2.5" ry="2" fill="#4E342E"/>
  
  <!-- Head -->
  <circle cx="32" cy="34" r="14" fill="url(#cap_body)"/>
  
  <!-- Ears -->
  <ellipse cx="20" cy="32" rx="4" ry="6" fill="url(#cap_body)"/>
  <ellipse cx="44" cy="32" rx="4" ry="6" fill="url(#cap_body)"/>
  <ellipse cx="20" cy="32" rx="2" ry="3" fill="#FFB7B7" fill-opacity="0.4"/>
  <ellipse cx="44" cy="32" rx="2" ry="3" fill="#FFB7B7" fill-opacity="0.4"/>
  
  <!-- Horns -->
  <path d="M24 26 Q20 18 16 14 Q14 12 16 10 Q20 10 22 16 Q24 20 26 24" fill="url(#cap_horn)"/>
  <path d="M40 26 Q44 18 48 14 Q50 12 48 10 Q44 10 42 16 Q40 20 38 24" fill="url(#cap_horn)"/>
  
  <!-- Goatee -->
  <path d="M32 46 Q30 52 32 56 Q34 52 32 46" fill="url(#cap_body)"/>
  
  <!-- Eyes -->
  <circle cx="28" cy="34" r="4" fill="#FFF"/>
  <circle cx="38" cy="34" r="4" fill="#FFF"/>
  <circle cx="28" cy="34" r="2.5" fill="#4A3728"/>
  <circle cx="38" cy="34" r="2.5" fill="#4A3728"/>
  <circle cx="29" cy="33" r="1" fill="#FFF"/>
  <circle cx="39" cy="33" r="1" fill="#FFF"/>
  
  <!-- Blush -->
  <circle cx="23" cy="38" r="3" fill="#FFB7B7" fill-opacity="0.4"/>
  <circle cx="43" cy="38" r="3" fill="#FFB7B7" fill-opacity="0.4"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="40" rx="3" ry="2" fill="#5D4037"/>
  
  <!-- Smile -->
  <path d="M29 44 Q32 47 35 44" stroke="#4E342E" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  
  <!-- Stars -->
  <circle cx="10" cy="14" r="2" fill="#FFD93D"/>
  <circle cx="70" cy="20" r="1.5" fill="#FFF"/>
  <circle cx="16" cy="60" r="1.5" fill="#4DB6AC"/>
  
  <!-- Sparkle -->
  <path d="M60 14 L62 18 L60 16 L58 18 Z" fill="#FFD93D"/>
</svg>
