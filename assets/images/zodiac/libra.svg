<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="libra_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="100%" stop-color="#FF69B4"/>
    </linearGradient>
    <linearGradient id="libra_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="libra_plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#FFE4B5"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#libra_bg)"/>
  <circle cx="40" cy="40" r="35" fill="#FFF" fill-opacity="0.15"/>
  
  <!-- Main pole -->
  <rect x="38" y="50" width="4" height="18" rx="2" fill="url(#libra_gold)"/>
  <ellipse cx="40" cy="68" rx="8" ry="3" fill="url(#libra_gold)"/>
  
  <!-- Balance beam -->
  <rect x="12" y="34" width="56" height="4" rx="2" fill="url(#libra_gold)"/>
  
  <!-- Center decoration -->
  <circle cx="40" cy="36" r="6" fill="url(#libra_gold)"/>
  <circle cx="40" cy="36" r="3" fill="#FFF"/>
  
  <!-- Cute face on center -->
  <circle cx="38" cy="35" r="1" fill="#4A3728"/>
  <circle cx="42" cy="35" r="1" fill="#4A3728"/>
  <path d="M38 38 Q40 40 42 38" stroke="#4A3728" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  
  <!-- Left chain -->
  <path d="M16 38 L16 48" stroke="url(#libra_gold)" stroke-width="2"/>
  <circle cx="16" cy="40" r="1.5" fill="url(#libra_gold)"/>
  <circle cx="16" cy="44" r="1.5" fill="url(#libra_gold)"/>
  
  <!-- Right chain -->
  <path d="M64 38 L64 48" stroke="url(#libra_gold)" stroke-width="2"/>
  <circle cx="64" cy="40" r="1.5" fill="url(#libra_gold)"/>
  <circle cx="64" cy="44" r="1.5" fill="url(#libra_gold)"/>
  
  <!-- Left plate -->
  <ellipse cx="16" cy="52" rx="10" ry="4" fill="url(#libra_plate)"/>
  <ellipse cx="16" cy="50" rx="8" ry="3" fill="url(#libra_gold)"/>
  
  <!-- Heart on left plate -->
  <path d="M16 52 L14 54 Q12 52 14 50 Q16 48 16 50 Q16 48 18 50 Q20 52 18 54 Z" fill="#FF6B9D"/>
  
  <!-- Right plate -->
  <ellipse cx="64" cy="52" rx="10" ry="4" fill="url(#libra_plate)"/>
  <ellipse cx="64" cy="50" rx="8" ry="3" fill="url(#libra_gold)"/>
  
  <!-- Star on right plate -->
  <path d="M64 48 L65.5 51 L69 51 L66.5 53 L67.5 56 L64 54 L60.5 56 L61.5 53 L59 51 L62.5 51 Z" fill="#FFD93D"/>
  
  <!-- Decorative swirls -->
  <path d="M28 26 Q32 22 36 26" stroke="#FFD93D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M44 26 Q48 22 52 26" stroke="#FFD93D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Top decoration -->
  <circle cx="40" cy="20" r="4" fill="#FFD93D"/>
  <circle cx="40" cy="20" r="2" fill="#FFF"/>
  
  <!-- Stars -->
  <circle cx="12" cy="16" r="2" fill="#FFF"/>
  <circle cx="68" cy="18" r="1.5" fill="#FFF"/>
  <circle cx="24" cy="12" r="1.5" fill="#FFD93D"/>
  <circle cx="56" cy="14" r="1.5" fill="#FFD93D"/>
  
  <!-- Sparkles -->
  <path d="M8 30 L10 32 L8 34 L6 32 Z" fill="#FFF" fill-opacity="0.8"/>
  <path d="M72 28 L74 30 L72 32 L70 30 Z" fill="#FFF" fill-opacity="0.8"/>
</svg>
