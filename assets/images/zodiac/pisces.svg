<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="pisces_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="100%" stop-color="#26C6DA"/>
    </linearGradient>
    <linearGradient id="fish1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <linearGradient id="fish2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA68C8"/>
      <stop offset="100%" stop-color="#AB47BC"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="url(#pisces_bg)"/>
  <circle cx="40" cy="40" r="35" fill="#FFF" fill-opacity="0.15"/>
  
  <!-- Connecting ribbon -->
  <path d="M28 32 Q40 40 52 48" stroke="#FFD93D" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M28 32 Q40 28 40 40 Q40 52 52 48" stroke="#FFD93D" stroke-width="2" stroke-dasharray="4 2" fill="none"/>
  
  <!-- Fish 1 (Orange - swimming up) -->
  <ellipse cx="24" cy="28" rx="12" ry="8" fill="url(#fish1)" transform="rotate(-30 24 28)"/>
  <!-- Tail -->
  <path d="M12 36 Q6 38 8 44 Q12 42 14 38" fill="url(#fish1)"/>
  <path d="M12 36 Q6 34 8 28 Q12 30 14 34" fill="url(#fish1)"/>
  <!-- Fins -->
  <ellipse cx="20" cy="22" rx="4" ry="6" fill="#FFAB91" transform="rotate(-60 20 22)"/>
  <ellipse cx="28" cy="34" rx="3" ry="5" fill="#FFAB91" transform="rotate(30 28 34)"/>
  <!-- Eye -->
  <circle cx="30" cy="24" r="4" fill="#FFF"/>
  <circle cx="31" cy="24" r="2.5" fill="#4A3728"/>
  <circle cx="32" cy="23" r="1" fill="#FFF"/>
  <!-- Blush -->
  <circle cx="26" cy="28" r="2.5" fill="#FF8A80" fill-opacity="0.5"/>
  <!-- Smile -->
  <path d="M28 30 Q31 32 33 30" stroke="#BF360C" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Scales -->
  <circle cx="22" cy="26" r="2" fill="#FFCCBC" fill-opacity="0.5"/>
  <circle cx="18" cy="30" r="2" fill="#FFCCBC" fill-opacity="0.5"/>
  
  <!-- Fish 2 (Purple - swimming down) -->
  <ellipse cx="56" cy="52" rx="12" ry="8" fill="url(#fish2)" transform="rotate(30 56 52)"/>
  <!-- Tail -->
  <path d="M68 44 Q74 42 72 36 Q68 38 66 42" fill="url(#fish2)"/>
  <path d="M68 44 Q74 46 72 52 Q68 50 66 46" fill="url(#fish2)"/>
  <!-- Fins -->
  <ellipse cx="60" cy="58" rx="4" ry="6" fill="#CE93D8" transform="rotate(60 60 58)"/>
  <ellipse cx="52" cy="46" rx="3" ry="5" fill="#CE93D8" transform="rotate(-30 52 46)"/>
  <!-- Eye -->
  <circle cx="50" cy="56" r="4" fill="#FFF"/>
  <circle cx="49" cy="56" r="2.5" fill="#4A3728"/>
  <circle cx="48" cy="55" r="1" fill="#FFF"/>
  <!-- Blush -->
  <circle cx="54" cy="52" r="2.5" fill="#E1BEE7" fill-opacity="0.6"/>
  <!-- Smile -->
  <path d="M47 58 Q50 60 52 58" stroke="#6A1B9A" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Scales -->
  <circle cx="58" cy="54" r="2" fill="#E1BEE7" fill-opacity="0.5"/>
  <circle cx="62" cy="50" r="2" fill="#E1BEE7" fill-opacity="0.5"/>
  
  <!-- Bubbles -->
  <circle cx="36" cy="20" r="2" fill="#FFF" fill-opacity="0.6"/>
  <circle cx="32" cy="16" r="1.5" fill="#FFF" fill-opacity="0.6"/>
  <circle cx="44" cy="64" r="2" fill="#FFF" fill-opacity="0.6"/>
  <circle cx="48" cy="68" r="1.5" fill="#FFF" fill-opacity="0.6"/>
  
  <!-- Stars -->
  <circle cx="12" cy="12" r="2" fill="#FFD93D"/>
  <circle cx="68" cy="14" r="1.5" fill="#FFF"/>
  <circle cx="10" cy="60" r="1.5" fill="#FFF"/>
  <circle cx="70" cy="66" r="2" fill="#FFD93D"/>
  
  <!-- Yin-yang heart -->
  <path d="M40 36 L38 38 Q36 36 38 34 Q40 32 40 34 Q40 32 42 34 Q44 36 42 38 Z" fill="#FF6B9D"/>
</svg>
