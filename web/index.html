<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Horora - Your Daily Horoscope App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Horora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Horora - Your Daily Horoscope App</title>
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="Horora - Your Daily Horoscope App">
  <meta property="og:description" content="Get your daily horoscope and astrological insights with Horora.">
  <meta property="og:image" content="https://horora.app/icons/Icon-192.png">
  <meta property="og:url" content="https://horora.app">
  <meta property="og:type" content="website">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Horora - Your Daily Horoscope App">
  <meta name="twitter:description" content="Get your daily horoscope and astrological insights with Horora.">
  <meta name="twitter:image" content="https://horora.app/icons/Icon-192.png">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <style>
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      z-index: 9999;
    }
    .loading-content {
      text-align: center;
    }
    .progress-bar {
      width: 300px;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      margin: 20px auto;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #4CAF50;
      width: 0%;
      transition: width 0.3s ease;
    }
    .loading-status {
      margin-top: 20px;
      color: #666;
    }
    .error-message {
      margin-top: 20px;
      color: red;
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
      max-width: 300px;
      margin: 20px auto;
    }
    .retry-button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .retry-button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <script>
    // Add loading indicator with progress bar
    document.body.innerHTML = `
      <div class="loading">
        <div class="loading-content">
          <h2>Loading Horora...</h2>
          <div class="progress-bar">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
          </div>
          <div class="loading-status" id="loading-status">Initializing...</div>
          <div class="error-message" id="error-message"></div>
          <button class="retry-button" id="retry-button" style="display: none;">Retry</button>
        </div>
      </div>
    `;

    // Update loading progress
    function updateProgress(percent) {
      const progressBar = document.getElementById('progress-bar-fill');
      if (progressBar) {
        progressBar.style.width = percent + '%';
      }
    }

    // Update loading status
    function updateLoadingStatus(status) {
      const statusElement = document.getElementById('loading-status');
      if (statusElement) {
        statusElement.textContent = status;
      }
    }

    // Show error message
    function showError(message) {
      const errorElement = document.getElementById('error-message');
      const retryButton = document.getElementById('retry-button');
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.style.display = 'block';
      }
      if (retryButton) {
        retryButton.style.display = 'inline-block';
      }
    }

    // Hide error message
    function hideError() {
      const errorElement = document.getElementById('error-message');
      const retryButton = document.getElementById('retry-button');
      if (errorElement) {
        errorElement.style.display = 'none';
      }
      if (retryButton) {
        retryButton.style.display = 'none';
      }
    }

    // Initialize Flutter
    function initializeFlutter() {
      hideError();
      updateProgress(10);
      updateLoadingStatus('Loading Flutter engine...');

      try {
        // Download main.dart.js
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function(engineInitializer) {
            updateProgress(50);
            updateLoadingStatus('Initializing Flutter engine...');
            
            engineInitializer.initializeEngine().then(function(appRunner) {
              updateProgress(80);
              updateLoadingStatus('Starting application...');
              
              appRunner.runApp();
            }).catch(function(error) {
              showError('Failed to initialize Flutter engine: ' + error.message);
            });
          }
        });
      } catch (error) {
        showError('Failed to load Flutter: ' + error.message);
      }
    }

    // Error handling
    window.addEventListener('error', function(e) {
      console.error('Error:', e.message);
      showError('Error: ' + e.message);
    });

    // Handle unhandled promise rejections
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled Promise Rejection:', e.reason);
      showError('Unhandled Error: ' + e.reason);
    });

    // Add retry button functionality
    document.getElementById('retry-button').addEventListener('click', function() {
      initializeFlutter();
    });

    // Start initialization when page loads
    window.addEventListener('load', function(ev) {
      initializeFlutter();
    });

    // Check loading progress
    const checkProgress = setInterval(function() {
      if (window._flutter && window._flutter.loader) {
        updateProgress(30);
        updateLoadingStatus('Flutter loader ready');
      }
    }, 100);

    // Remove loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      updateProgress(100);
      updateLoadingStatus('Application ready!');
      setTimeout(function() {
        document.querySelector('.loading').style.display = 'none';
      }, 500);
    });
  </script>
</body>
</html>
